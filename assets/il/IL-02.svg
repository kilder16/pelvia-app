<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Dos paneles. Correcto: el suelo pélvico se eleva y aprieta hacia adentro, con abdomen y glúteos relajados y respiración normal. Incorrecto: empujar hacia abajo, aguantar la respiración y apretar los glúteos">
<title>Contracción correcta e incorrecta</title>
<rect width="400" height="300" rx="16" fill="#FFFFFF"/>
<g stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<rect x="10" y="10" width="185" height="280" rx="14" fill="#FFFFFF" stroke="#C9D3D0"/>
<circle cx="40" cy="38" r="15" fill="#2A7F7A" stroke="#2A7F7A"/>
<path d="M31 38 L37.3 45.2 L50.8 29.9" fill="none" stroke="#FFFFFF"/>
<text x="64" y="44" font-size="18" font-weight="bold" text-anchor="start" fill="#1F2A2E" font-family="system-ui, sans-serif">Correcto</text>
<path d="M40 72 C40 150 70 176 102 176 C134 176 164 150 164 72" fill="none" stroke="#C9D3D0" stroke-width="8"/>
<path d="M48 140 Q102 116 156 140" fill="none" stroke="#E26D5A" stroke-width="8"/>
<path d="M102 166 L102 134 M107.2 142.5 L102 134 L96.8 142.5" fill="none" stroke="#2A7F7A"/>
<path d="M72 160 L72 140 M77.2 148.5 L72 140 L66.8 148.5" fill="none" stroke="#2A7F7A"/>
<path d="M132 160 L132 140 M137.2 148.5 L132 140 L126.8 148.5" fill="none" stroke="#2A7F7A"/>
<text x="102" y="204" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">Eleva y aprieta</text>
<text x="102" y="223" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">hacia adentro</text>
<text x="102" y="242" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">Abdomen y glúteos</text>
<text x="102" y="261" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">relajados</text>
<text x="102" y="280" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">Respira normal</text>
<rect x="205" y="10" width="185" height="280" rx="14" fill="#FFFFFF" stroke="#C9D3D0"/>
<circle cx="235" cy="38" r="15" fill="#E26D5A" stroke="#E26D5A"/>
<path d="M229 32 L241 44 M241 32 L229 44" fill="none" stroke="#FFFFFF"/>
<text x="259" y="44" font-size="18" font-weight="bold" text-anchor="start" fill="#1F2A2E" font-family="system-ui, sans-serif">Incorrecto</text>
<path d="M235 72 C235 150 265 176 297 176 C329 176 359 150 359 72" fill="none" stroke="#C9D3D0" stroke-width="8"/>
<path d="M243 140 Q297 186 351 140" fill="none" stroke="#E26D5A" stroke-width="8"/>
<path d="M297 88 L297 150 M291.8 141.5 L297 150 L302.2 141.5" fill="none" stroke="#E26D5A"/>
<text x="297" y="204" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">Empuja hacia abajo</text>
<text x="297" y="223" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">Aguanta la</text>
<text x="297" y="242" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">respiración</text>
<text x="297" y="261" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">Aprieta los</text>
<text x="297" y="280" font-size="15" text-anchor="middle" fill="#1F2A2E" font-family="system-ui, sans-serif">glúteos</text>
</g>
</svg>
